<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos - Clientes</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#198754">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container py-4" style="max-width: 500px;">

        <!-- Encabezado -->
        <div class="text-center mb-4">

            <div class="d-inline-flex justify-content-center align-items-center bg-info text-dark rounded-circle shadow mb-3"
                style="width:70px;height:70px;">
                <i class="bi bi-basket fs-2"></i>
            </div>

            <h2 class="fw-bold mb-1">
                Realizar Pedido
            </h2>

            <p class="text-muted small mb-0">
                Selecciona tus productos y completa la información de entrega
            </p>

        </div>

        <!-- Producto -->
        <div class="card border-0 shadow-sm rounded-4 mb-3">

            <div class="card-body">

                <label class="form-label fw-semibold">
                    <i class="bi bi-box-seam me-2"></i>Producto
                </label>

                <select id="select-producto" class="form-select bg-body-tertiary border-0 mb-3">
                    <option selected disabled>
                        Cargando productos...
                    </option>
                </select>

                <label class="form-label fw-semibold">
                    <i class="bi bi-card-list me-2"></i>Cantidad
                </label>

                <div class="d-flex gap-2 align-items-center">

                    <div class="input-group" style="width: 230px;">

                        <button class="btn btn-outline-danger" type="button" id="btn-menos">
                            <i class="bi bi-dash-lg"></i>
                        </button>

                        <input type="text" id="input-cantidad" class="form-control text-center fw-bold" value="1">

                        <button class="btn btn-outline-success" type="button" id="btn-mas">
                            <i class="bi bi-plus-lg"></i>
                        </button>

                    </div>

                    <button id="btn-agregar" class="btn btn-primary text-nowrap" style="width: 230px;">

                        <i class="bi bi-cart-plus-fill me-2"></i>
                        Agregar

                    </button>

                </div>

            </div>

        </div>

        <!-- Pedido -->
        <div class="card border-0 shadow-sm rounded-4 mb-3">

            <div class="card-body">
                <h5 class="fw-bold mb-3">
                    <i class="bi bi-cart4 me-2"></i>
                    Productos del Pedido
                </h5>
                <div id="lista-pedido">
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-cart-x fs-1"></i>
                        <p class="mb-0 mt-2">No hay productos agregados</p>
                    </div>
                </div>
                <hr>
                <div class="alert alert-success mb-0 d-flex justify-content-between align-items-center">
                    <span class="fw-bold">
                        Total
                    </span>
                    <span id="total-pedido" class="fs-4 fw-bold">
                        ₡0
                    </span>
                </div>
            </div>

        </div>

        <!-- Cliente -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">

            <div class="card-body">

                <label class="form-label fw-semibold">
                    <i class="bi bi-person-fill me-2"></i>
                    Nombre completo
                </label>
                <input type="text" id="input-nombre" class="form-control mb-3" placeholder="Ingrese su nombre">

                <label class="form-label fw-semibold">
                    <i class="bi bi-geo-alt-fill me-2"></i>
                    Dirección de entrega
                </label>
                <div class="input-group mb-4">
                    <input type="text" id="input-direccion" class="form-control"
                        placeholder="Ingrese o busque su dirección">
                    <button type="button" id="btn-maps" class="btn btn-outline-warning">
                        <i class="bi bi-map-fill"></i>
                    </button>
                </div>

                <button id="btn-enviar" class="btn btn-success w-100 py-3 fw-bold">
                    <i class="bi bi-send-fill me-2"></i>
                    Confirmar Pedido
                </button>

            </div>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalConfirmacion" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-body text-center p-4">

                    <div class="bg-success text-white d-inline-flex justify-content-center align-items-center rounded-circle mb-3"
                        style="width:70px;height:70px;">
                        <i class="bi bi-check-lg fs-1"></i>
                    </div>
                    <h4 class="fw-bold">
                        ¡Pedido enviado!
                    </h4>
                    <p class="text-muted">
                        Tu pedido ha sido registrado correctamente.
                    </p>
                    <button class="btn btn-success w-100" data-bs-dismiss="modal">
                        Aceptar
                    </button>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>

</body>

</html>
